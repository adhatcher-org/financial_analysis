[postgres]
dsn = "postgresql://USER:PASSWORD@YOUR-POSTGRES-HOST:5432/home_llm"
dsn_env_var = "HOME_LLM_POSTGRES_DSN"

[ollama]
base_url = "http://127.0.0.1:11434"
chat_model = "llama3.1:8b"
embedding_model = "embeddinggemma:latest"
enabled = true

[qdrant]
enabled = false
base_url = "http://YOUR-QDRANT-HOST:6333"
collection = "financial_documents"
api_key = ""
api_key_env_var = "HOME_LLM_QDRANT_API_KEY"

[ingest]
source_dirs = [
  "/Users/yourname/Documents/Finance/*/*/2026",
  "/Users/yourname/Documents/Insurance/*/2026",
]
chunk_size = 1400
chunk_overlap = 200
extensions = [".pdf", ".txt", ".md", ".csv"]

[query]
top_k = 6

[paperless]
enabled = false
base_url = "https://paperless.example.com"
token = ""
token_env_var = "HOME_LLM_PAPERLESS_TOKEN"
page_size = 100
