[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "home-llm"
version = "0.1.0"
description = "Local-first Q&A over financial and insurance documents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.3,<1.0.0",
    "uvicorn>=0.35.0,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pypdf>=6.9.2,<7.0.0",
    "requests>=2.33.1,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.8.6,<2.0.0",
    "build>=1.3.0,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
    "mypy>=1.20.1,<2.0.0",
    "pip-audit>=2.9.0,<3.0.0",
    "pre-commit>=4.3.0,<5.0.0",
    "pytest>=8.4.0,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.13.0,<1.0.0",
    "types-requests>=2.32.4,<3.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["home_llm"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["home_llm"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
packages = ["home_llm"]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.bandit]
exclude_dirs = [".venv", "build", "tests"]
